# pre-commit：提交前自动格式化与基础检查
# 安装：pre-commit install
# 全量：pre-commit run --all-files
# 说明：clang-format / mypy 走本机工具（language: system），版本由开发环境保证。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format
        args: [--dry-run, --Werror]
        language: system
        files: \.(h|hh|hpp|hxx|cc|cpp|cxx)$
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        files: \.py$
        pass_filenames: true
